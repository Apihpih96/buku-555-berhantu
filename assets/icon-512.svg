<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Buku 555 Berhantu icon">
  <title>Buku 555 Berhantu</title>
  <!-- Dark red rounded-square background (maskable safe zone: inner 75%) -->
  <rect width="512" height="512" rx="72" ry="72" fill="#8B0000"/>
  <!-- Subtle inner vignette for depth -->
  <rect width="512" height="512" rx="72" ry="72" fill="url(#vignette512)" opacity="0.3"/>
  <defs>
    <radialGradient id="vignette512" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </radialGradient>
  </defs>
  <!-- Ghost body — centred at 256,240, scaled ~4.4x from original 64x80 -->
  <g transform="translate(256,240) scale(4.4)">
    <!-- Ghost body ellipse -->
    <ellipse cx="0" cy="0" rx="22" ry="26" fill="rgba(255,255,255,0.93)" stroke="rgba(255,255,255,0.5)" stroke-width="0.5"/>
    <!-- Skirt with wavy bottom -->
    <path d="
      M-22,18
      Q-22,36 -16,32
      Q-12,28 -8,32
      Q-4,36 0,32
      Q4,28 8,32
      Q12,36 16,32
      Q22,28 22,18
      Z
    " fill="rgba(255,255,255,0.93)" stroke="rgba(255,255,255,0.5)" stroke-width="0.5"/>
    <!-- Eyes -->
    <ellipse cx="-8" cy="-2" rx="4" ry="5" fill="#5a0000"/>
    <ellipse cx="8" cy="-2" rx="4" ry="5" fill="#5a0000"/>
    <!-- Eye gleam -->
    <circle cx="-6.5" cy="-3.5" r="1.2" fill="white"/>
    <circle cx="9.5" cy="-3.5" r="1.2" fill="white"/>
    <!-- Smile -->
    <path d="M-6,8 Q0,14 6,8" stroke="#5a0000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Rosy cheeks -->
    <ellipse cx="-13" cy="4" rx="4" ry="2.5" fill="rgba(255,180,180,0.45)"/>
    <ellipse cx="13" cy="4" rx="4" ry="2.5" fill="rgba(255,180,180,0.45)"/>
  </g>
  <!-- Tiny floating stars -->
  <circle cx="96"  cy="112" r="8"  fill="rgba(255,220,50,0.8)"/>
  <circle cx="416" cy="96"  r="6"  fill="rgba(255,220,50,0.7)"/>
  <circle cx="392" cy="160" r="7"  fill="rgba(255,220,50,0.6)"/>
  <circle cx="112" cy="400" r="5"  fill="rgba(255,220,50,0.6)"/>
  <circle cx="420" cy="400" r="4"  fill="rgba(255,220,50,0.5)"/>
</svg>
